<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Register</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <div class="navbar">
      <div class="logo">
        <img src="images/civiscan.png" width="32" height="30" />
        CiviScan
      </div>

      <div class="nav-right">
        <button class="btn" onclick="location.href = '/'">Home</button>
      </div>
    </div>

    <!-- REGISTER CARD -->

    <div class="form-container">
      <div class="form-card">
        <div class="form-row">
          <label>Username:</label>
          <input type="text" />
        </div>

        <div class="form-row">
          <label>Password:</label>
          <input type="text" />
        </div>

        <div class="form-row">
          <label>Email:</label>
          <input type="text" />
        </div>

        <div class="form-row">
          <label>Phone Number:</label>
          <input type="text" />
        </div>

        <div class="register-btn-box">
          <button class="register-btn" onclick="location.href = '/'">
            Register
          </button>
        </div>
      </div>
    </div>

    <!-- FOOTER -->

    <footer>
      <div class="footer-left">
        <img src="images/civiscan.png" width="32" height="30" />
        CiviScan
      </div>

      <div class="footer-center">
        <b>About Us</b><br />
        <a href="#">Home</a> | <a href="#">Term & Condition</a> |
        <a href="#">Privacy Policy</a> |
        <a href="#">Contact Us</a>
      </div>

      <div class="footer-right">
        <b>Social Media</b><br />

        <img src="images/ig.png" width="30" />
        <img src="images/fb.png" width="30" />
        <img src="images/wa.png" width="30" />
        <img src="images/yt.png" width="30" />
      </div>
    </footer>
  </body>
</html>
