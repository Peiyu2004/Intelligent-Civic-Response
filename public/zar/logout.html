<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Card</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: fit-content;
  margin: 0;
  padding: 0;
  background: transparent !important;
  font-family: Arial, Helvetica, sans-serif;
}

.user-card {
  background: linear-gradient(135deg, #4e73df, #a66dd4);
  border-radius: 20px;
  padding: 16px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.avatar {
  border: 3px solid rgba(255,255,255,0.8);
  border-radius: 50%;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: rgba(255,255,255,0.2);
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h2 {
  font-style: italic;
  font-size: 14px;
  color: white;
  margin: 0;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 8px;
  width: 100%;
}

.btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: 40px;
  border: none;
  background: rgba(255,255,255,0.25);
  color: white;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
}

.btn:hover { background: rgba(255,255,255,0.45); }
</style>
</head>
<body>

<div class="user-card">
  <div class="avatar">
    <img src="images/user.png" alt="user">
  </div>
  <h2>USER</h2>
  <div class="buttons">
    <button class="btn">View Profile</button>
    <button class="btn" onclick="window.top.location.href='homePage.html'">Log out</button>
  </div>
</div>

</body>
</html>

<script>
  // Tell parent to resize iframe to exact card height — no excess space
  function fitParent() {
    const h = document.querySelector('.user-card').offsetHeight;
    if (window.frameElement) {
      window.frameElement.style.height = h + 'px';
    }
  }
  window.addEventListener('load', fitParent);
  window.addEventListener('resize', fitParent);
</script>
