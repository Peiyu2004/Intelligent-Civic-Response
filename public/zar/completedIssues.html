<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Issue History</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="dashboard-page">


<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
CiviScan
</div>

<div class="top-right">

<button class="btn"><img src="images/user.png" alt="user" width="20" height="20">&nbsp&nbspUSER</button>

<span class="icon"><img src="images/notif.png" alt="notif" width="32" height="30"></span>
<span class="icon"><img src="images/setting.png" alt="setting" width="32" height="30"></span>

</div>

</div>



<div class="dashboard">


<!-- SIDEBAR -->

<div class="sidebar">

<div class="menu active"><img src="images/reportissue2.png" alt="report" width="42" height="35">Report issue</div>
<div class="menu"><img src="images/history2.png" alt="history" width="42" height="40">Issue History</div>
<div class="menu"><img src="images/feedback.png" alt="feeback" width="32" height="30">Feedback</div>

</div>



<!-- CONTENT -->

<div class="content">


<!-- FILTER -->

<div class="filter">

<button class="tab">All</button>
<button class="tab">In Progress</button>
<button class="tab active">Completed</button>

</div>



<!-- TABLE -->

<table class="issue-table">

<tr>
<th>Report ID</th>
<th>Location</th>
<th>Issue Type</th>
<th>Severity</th>

<th>Cluster ID</th>

</tr>

</tr>

</table>



</div>

</div>

</body>
</html>
