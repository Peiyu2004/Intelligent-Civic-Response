<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Report Issue</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="dashboard-page">


<!-- TOP BAR -->

<div class="topbar">

<div class="logo">
CiviScan
</div>

<div class="top-right">

<button class="btn"><img src="images/user.png" alt="user" width="20" height="20">&nbsp&nbspUSER</button>

<span class="icon"><img src="images/notif.png" alt="notif" width="32" height="30"></span>
<span class="icon"><img src="images/setting.png" alt="setting" width="32" height="30"></span>

</div>

</div>



<!-- MAIN -->

<div class="dashboard">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="menu active"><img src="images/reportissue2.png" alt="report" width="42" height="35">Report issue</div>
<div class="menu"><img src="images/history2.png" alt="history" width="42" height="40">Issue History</div>
<div class="menu"><img src="images/feedback.png" alt="feeback" width="32" height="30">Feedback</div>

</div>



<!-- CONTENT -->

<div class="content">


<!-- IMAGE UPLOAD -->

<div class="box">

<h3>Image Upload:</h3>

<div class="upload-row">

<img src="road.jpg" class="upload-img" id="preview">

<label for="fileUpload" class="upload-btn">
&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp+
<br>
Add Image
</label>

<input type="file" id="fileUpload" accept="image/*" hidden>

</div>

</div>



<!-- LOCATION -->

<div class="box">

<h3>Location:</h3>

<div class="location-row">

<img src="map.jpg" class="map-img">

<div class="location-text">
</div>

</div>

</div>



<!-- DESCRIPTION -->

<div class="box">

<h3>Description:</h3>

<textarea class="desc-box">
</textarea>

</div>



<div class="btn-area">
<button class="start-btn">Generate Severity</button>
</div>


</div>

</div>

</body>
</html>
