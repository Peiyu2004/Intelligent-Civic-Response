<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report Issue - Place One Red Pin</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" /> <!-- Leaflet CSS -->

  <style>
    /* Set map container size */
    #map {
      height: 500px;
      width: 100%;
    }
  </style>
</head>

<body class="dashboard-page">

<!-- TOP BAR -->

<div class="topbar">

  <div class="logo">
    CiviScan
  </div>

  <div class="top-right">

    <!-- Container for hover popup -->
    <div class="hover-container">
      <button class="btn user-btn">
        <img src="images/user.png" alt="user" width="20" height="20">
        USER
      </button>

      <!-- Popup with iframe -->
      <div class="popup">
        <iframe src="logout.html" width="300" height="200" frameborder="0"></iframe>
      </div>
    </div> 

    <span class="icon"><img src="images/notif.png" alt="notif" width="32" height="30"></span>
    <span class="icon"><img src="images/setting.png" alt="setting" width="32" height="30"></span>

  </div>

</div>

<!-- MAIN -->

<div class="dashboard">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="menu active"><img src="images/reportissue2.png" alt="report" width="42" height="35">Report issue</div>
    <a href="issueHistory.html" class="menu">
      <img src="images/history2.png" alt="history" width="42" height="40">
      Issue History
    </a>
    <a href="feedback.html" class="menu">
      <img src="images/feedback.png" alt="feeback" width="32" height="30">
      Feedback
    </a>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- IMAGE UPLOAD -->

    <div class="box">

    <h3>Image Upload:</h3>

    <div class="upload-row">

    <img src="images/example.png" class="upload-img" id="preview">

    <label for="fileUpload" class="upload-btn">
    &nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp+
    <br>
    Add Image
    </label>

    <input type="file" id="fileUpload" accept="image/*" hidden>

    </div>

    </div>

    <!-- LOCATION -->
    <div class="box">
      <h3>Location:</h3>
      <div class="location-row">

        <!-- Leaflet Map Container -->
        <div id="map" style="height: 300px; width: 100%;"></div> <!-- Leaflet Map -->

        <textarea id="locationInput" class="location-box" placeholder="Enter location details here..."></textarea>

      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="box">
      <h3>Description:</h3>
      <textarea class="desc-box"></textarea>
    </div>

    <div class="btn-area">
      <button class="start-btn" onclick="location.href = 'results.html'">
        Generate Severity
      </button>
    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script> <!-- Leaflet JS -->

<script>
  // Initialize Leaflet map and set the initial view to Malaysia (Kuala Lumpur)
  const map = L.map('map').setView([3.139, 101.6869], 13); // Coordinates for Kuala Lumpur, Malaysia

  // Add OpenStreetMap tile layer
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // Custom red pin icon using the local red pin image
  const redIcon = new L.Icon({
    iconUrl: "images/redpin.png",
    iconSize: [50, 50],
    iconAnchor: [25, 50],
    popupAnchor: [0, -40],
  });

  // Variable to store the existing marker
  let existingMarker = null;
  let typingTimer = null;

  // Function to place marker
  function placeMarker(lat, lng, popupText) {
    if (existingMarker) {
      map.removeLayer(existingMarker);
    }

    existingMarker = L.marker([lat, lng], { icon: redIcon })
      .addTo(map)
      .bindPopup(popupText || `Red pin at (${lat.toFixed(4)}, ${lng.toFixed(4)})`)
      .openPopup();

    map.setView([lat, lng], 16);
  }

  // Function to search location from typed text
  async function searchLocation(query) {
    if (!query || query.trim().length < 3) return;

    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`
      );

      const data = await res.json();

      if (data.length === 0) return;

      const lat = parseFloat(data[0].lat);
      const lng = parseFloat(data[0].lon);
      const displayName = data[0].display_name;

      placeMarker(lat, lng, displayName);

    } catch (err) {
      console.error("Location search error:", err);
    }
  }

  // Detect typing automatically and update map
  const locationInput = document.getElementById("locationInput");

  locationInput.addEventListener("input", function() {
    clearTimeout(typingTimer);

    const query = this.value.trim();

    typingTimer = setTimeout(() => {
      searchLocation(query);
    }, 800);
  });

  // Keep manual map click function
  map.on('click', function(e) {
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    placeMarker(lat, lng, "Red pin at (" + lat.toFixed(4) + ", " + lng.toFixed(4) + ")");
  });
</script>

<script>

const fileInput = document.getElementById("fileUpload");
const preview = document.getElementById("preview");

let uploadedImagePath = "";

// When user selects image
fileInput.addEventListener("change", async function () {

    const file = this.files[0];

    if (!file) return;

    // -------------------
    // Show preview locally
    // -------------------
    preview.src = URL.createObjectURL(file);


    // -------------------
    // Upload to Flask
    // -------------------
    const formData = new FormData();
    formData.append("file", file);

    try {

        const res = await fetch("http://127.0.0.1:5000/api/upload", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        console.log(data);

        uploadedImagePath = data.image_path;

    } catch (err) {
        console.error(err);
    }

});

</script>

</body>
</html>
