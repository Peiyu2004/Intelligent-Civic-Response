<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Analysis Result</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="dashboard-page">


<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
CiviScan
</div>

<div class="top-right">

  <!-- Container for hover popup -->
<div class="hover-container">
  <button class="btn user-btn">
    <img src="images/user.png" alt="user" width="20" height="20">
    USER
  </button>

  <!-- Popup with iframe -->
  <div class="popup">
    <iframe src="logout.html" width="300" height="200" frameborder="0"></iframe>
  </div>
</div> 

<span class="icon"><img src="images/notif.png" alt="notif" width="32" height="30"></span>
<span class="icon"><img src="images/setting.png" alt="setting" width="32" height="30"></span>
</div>

</div>



<div class="dashboard">


<!-- SIDEBAR -->

<div class="sidebar">

<div class="menu active"><img src="images/reportissue2.png" alt="report" width="42" height="35">Report issue</div>
<a href="issueHistory.html" class="menu">
  <img src="images/history2.png" alt="history" width="42" height="40">
  Issue History
</a>
<a href="feedback.html" class="menu">
  <img src="images/feedback.png" alt="feeback" width="32" height="30">
  Feedback
</a>
</div>



<!-- CONTENT -->

<div class="content center-content">



<!-- SCORE -->

<div class="score-circle">
8
</div>


<div class="score-bar">

<div class="score-fill"></div>

<span class="score-text">8 / 10</span>

</div>



<!-- INSIGHT BOX -->

<div class="box">

<h3>Other Insights:</h3>

<p><img src="images/tick.png" alt="loading" width="20" height="20">Damage Type: Pathole</p>
<p><img src="images/tick.png" alt="loading" width="20" height="20">Severity score: 8 / 10</p>
<p><img src="images/loading2.gif" alt="loading" width="32" height="30"> Description: Large patholes detected</p>
<p><img src="images/loading2.gif" alt="loading" width="32" height="30">Status: High Priority</p>

</div>



<!-- PRIORITY -->

<div class="priority">

<div class="p low">
1 ~ 3 &nbsp; Low Priority
</div>

<div class="p mid">
4 ~ 6 &nbsp; Medium Priority
</div>

<div class="p high">
7 ~ 10 &nbsp; High Priority
</div>

</div>



<div class="result-buttons">

<button class="start-btn" onclick="location.href = 'report.html'">
    Back
</button>

<button class="start-btn" onclick="location.href = 'issueHistory.html'">
    Submit
</button>

</div>



</div>

</div>

</body>
</html>
