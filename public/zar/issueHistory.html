<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Issue History</title>
<link rel="stylesheet" href="style.css">
<style>
  .empty-msg {
    text-align: center; padding: 40px; color: #888; font-size: 16px;
  }
  .clear-btn {
    float: right; padding: 6px 16px; border-radius: 20px;
    border: 1px solid #ccc; background: #f5f5f5;
    cursor: pointer; font-size: 13px; color: #555;
  }
  .clear-btn:hover { background: #e0e0e0; }
</style>
</head>

<body class="dashboard-page">

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">CiviScan</div>
  <div class="top-right">
    <div class="hover-container">
      <button class="btn user-btn">
        <img src="images/user.png" alt="user" width="20" height="20"> USER
      </button>
      <div class="popup">
        <div class="popup-avatar"><img src="images/user.png" alt="user"></div>
        <div class="popup-name">USER</div>
        <div class="popup-buttons">
          <button class="popup-btn" onclick="location.href='profile.html'">View Profile</button>
          <button class="popup-btn" onclick="location.href='homePage.html'">Log Out</button>
        </div>
      </div>
    </div>
    <span class="icon" style="cursor:pointer" onclick="location.href='notifications.html'">
      <img src="images/notif.png" alt="notif" width="32" height="30">
    </span>
    <span class="icon" style="cursor:pointer" onclick="location.href='settings.html'">
      <img src="images/setting.png" alt="setting" width="32" height="30">
    </span>
  </div>
</div>

<div class="dashboard">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="report.html" class="menu">
      <img src="images/reportissue2.png" alt="report" width="42" height="35"> Report issue
    </a>
    <div class="menu active">
      <img src="images/history2.png" alt="history" width="42" height="40"> Issue History
    </div>
    <a href="feedback.html" class="menu">
      <img src="images/feedback.png" alt="feedback" width="32" height="30"> Feedback
    </a>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <!-- FILTER BUTTONS -->
      <div class="filter">
        <button class="tab filter-btn active" data-status="all">All</button>
        <button class="tab filter-btn" data-status="In Progress">In Progress</button>
        <button class="tab filter-btn" data-status="Completed">Completed</button>
      </div>
      <button class="clear-btn" onclick="clearHistory()">Clear History</button>
    </div>

    <!-- TABLE -->
    <table class="issue-table" id="historyTable">
      <thead>
        <tr>
          <th>Report ID</th>
          <th>Location</th>
          <th>Issue Type</th>
          <th>Severity</th>
          <th>Date</th>
          <th>Repair Status</th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <!-- Filled by JS -->
      </tbody>
    </table>

    <div class="empty-msg" id="emptyMsg" style="display:none;">
      No reports submitted yet. <a href="report.html">Submit your first report →</a>
    </div>

  </div>
</div>

<script>
  var currentFilter = 'all';

  function loadHistory() {
    var history = JSON.parse(localStorage.getItem('civiHistory') || '[]');
    var tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';

    var filtered = history.filter(function(r) {
      return currentFilter === 'all' || r.status === currentFilter;
    });

    if (filtered.length === 0) {
      document.getElementById('emptyMsg').style.display = 'block';
      document.getElementById('historyTable').style.display = 'none';
    } else {
      document.getElementById('emptyMsg').style.display = 'none';
      document.getElementById('historyTable').style.display = '';

      filtered.forEach(function(r) {
        var severityColor = r.severity >= 7 ? '#c0392b' : r.severity >= 4 ? '#e67e22' : '#27ae60';
        var statusClass   = r.status === 'Completed' ? 'status-done' : 'status-progress';

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + r.report_id + '</td>' +
          '<td>' + r.location + '</td>' +
          '<td style="text-transform:capitalize">' + r.issue_type + '</td>' +
          '<td><span style="font-weight:bold;color:' + severityColor + '">' + r.severity + ' / 10</span></td>' +
          '<td>' + r.date + '</td>' +
          '<td class="' + statusClass + '">' + r.status + '</td>';
        tbody.appendChild(tr);
      });
    }
  }

  function clearHistory() {
    if (confirm('Clear all report history?')) {
      localStorage.removeItem('civiHistory');
      loadHistory();
    }
  }

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-status');
      loadHistory();
    });
  });

  // Load on page open
  loadHistory();
</script>

</body>
</html>
