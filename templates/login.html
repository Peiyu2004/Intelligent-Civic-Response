<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CiviScan Login</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

<div class="logo"><img src="00-removebg-preview.png" alt="klcc" width="32" height="30"> CiviScan</div>

<button class="home-btn">Home</button>

</div>


<!-- LOGIN BOX -->

<div class="login-container">

<div class="form-row">
<label>Username:</label>
<input type="text" placeholder="User123">
</div>

<div class="form-row">
<label>Password:</label>
<input type="password" placeholder="Password123">
</div>


<div class="button-row">
<button class="btn">Forget Password</button>
<button class="btn">Login</button>
</div>

<div class="register-row">
<button class="btn">Register</button>
</div>

</div>


<!-- FOOTER -->

<footer>

<div class="footer-left">
<img src="00-removebg-preview.png" alt="bubble" width="32" height="30"> CiviScan
</div>

<div class="footer-center">
<b>About Us</b><br>
<a href="#">Home</a> |
<a href="#">Term & Condition</a> |
<a href="#">Privacy Policy</a> |
<a href="#">Contact Us</a>
</div>

<div class="footer-right">
<b>Social Media</b><br>
<span><img src="ig.png" alt="instagram" width="32" height="30"></span>
<span><img src="fb.png" alt="facebook" width="32" height="30"></span>
<span><img src="wa.png" alt="whatsapp" width="32" height="30"></span>
<span><img src="yt.png" alt="youtube" width="32" height="30"></span>
</div>

</footer>


</body>
</html>
